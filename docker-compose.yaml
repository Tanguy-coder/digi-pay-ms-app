services:
  customer-db:
    image: postgres:16-alpine
    container_name: customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  wallet-db:
    image: postgres:16-alpine
    container_name: wallet-db
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    volumes:
      - wallet_db_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  fraud-db:
    image: postgres:16-alpine
    container_name: fraud-db
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    volumes:
      - fraud_db_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  settlement-db:
    image: postgres:16-alpine
    container_name: settlement-db
    environment:
      POSTGRES_DB: settlement_db
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
    volumes:
      - settlement_db_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    expose:
      - "8761"
    container_name: discovery-service

  customer-service:
    build: ./customer-service
    ports:
      - "8082:8082"
    expose:
      - "8082"
    container_name: customer-service
    depends_on:
      - kafka
      - discovery-service
      - customer-db
      - jaeger
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      DB_HOST: customer-db
      DB_NAME: customer_db
      DB_USER: customer
      DB_PASSWORD: customer
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  wallet-service:
    build: ./wallet-service
    ports:
      - "8083:8083"
    expose:
      - "8083"
    container_name: wallet-service
    depends_on:
      - kafka
      - discovery-service
      - wallet-db
      - jaeger
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      DB_HOST: wallet-db
      DB_NAME: wallet_db
      DB_USER: wallet
      DB_PASSWORD: wallet
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  payment-service:
    build: ./payment-service
    ports:
      - "8084:8084"
    expose:
      - "8084"
    container_name: payment-service
    depends_on:
      - kafka
      - redis
      - discovery-service
      - payment-db
      - jaeger
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      DB_HOST: payment-db
      DB_NAME: payment_db
      DB_USER: payment
      DB_PASSWORD: payment
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  fraud-service:
    build: ./fraud-service
    ports:
      - "8085:8085"
    expose:
      - "8085"
    container_name: fraud-service
    depends_on:
      - kafka
      - discovery-service
      - fraud-db
      - jaeger
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      DB_HOST: fraud-db
      DB_NAME: fraud_db
      DB_USER: fraud
      DB_PASSWORD: fraud
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8086"
    expose:
      - "8086"
    container_name: notification-service
    depends_on:
      - kafka
      - discovery-service
      - jaeger
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  settlement-service:
    build: ./settlement-service
    ports:
      - "8087:8087"
    expose:
      - "8087"
    container_name: settlement-service
    depends_on:
      - kafka
      - discovery-service
      - settlement-db
      - jaeger
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      DB_HOST: settlement-db
      DB_NAME: settlement_db
      DB_USER: settlement
      DB_PASSWORD: settlement
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

  gateway-service:
    build: ./gateway-service
    ports:
      - "8888:8888"
    expose:
      - "8888"
    container_name: gateway-service
    depends_on:
      - discovery-service
      - keycloak
      - redis
      - jaeger
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/digipay
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/digipay/protocol/openid-connect/certs
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      REDIS_HOST: redis
      REDIS_PORT: 6379

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  customer_db_data:
  wallet_db_data:
  payment_db_data:
  fraud_db_data:
  settlement_db_data:
  keycloak_db_data:
  sonar_data:
  sonar_logs:
  sonar_extensions:
  prometheus_data:
  grafana_data:
